name: PharmaOS NcheSent research bridge checks
on:
  pull_request:
  push:
    branches: [main, "integration/**"]
jobs:
  research-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi>=0.115,<1" "httpx>=0.27,<1" "pydantic>=2,<3"
      - run: python -m unittest discover -s tests -p "test_nchesent_bridge.py"
      - run: python -m unittest discover -s tests -p "test_nchesent_analysis.py"
  research-studio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
