name: Formulary API Syntax

on:
  pull_request:
    paths:
      - "api/index.py"
      - "backend/app/formulary_pk.py"
      - "backend/app/formulary_regulatory.py"
      - "backend/app/formulary_journal.py"
      - "backend/app/formulary_grants.py"
      - ".github/workflows/formulary-api.yml"
  push:
    branches:
      - main
    paths:
      - "api/index.py"
      - "backend/app/formulary_pk.py"
      - "backend/app/formulary_regulatory.py"
      - "backend/app/formulary_journal.py"
      - "backend/app/formulary_grants.py"

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile API modules
        run: python -m py_compile api/index.py backend/app/formulary_pk.py backend/app/formulary_regulatory.py backend/app/formulary_journal.py backend/app/formulary_grants.py
