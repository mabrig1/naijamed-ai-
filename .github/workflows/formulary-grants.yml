name: Formulary Grant Project Studio

on:
  pull_request:
    paths:
      - "backend/app/formulary_grants.py"
      - "backend/tests/test_formulary_grants.py"
      - ".github/workflows/formulary-grants.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/formulary_grants.py"
      - "backend/tests/test_formulary_grants.py"

permissions:
  contents: read

jobs:
  grant-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install settings dependency
        run: pip install "pydantic-settings>=2,<3"

      - name: Run Grant Project Studio unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_formulary_grants.py" -v
