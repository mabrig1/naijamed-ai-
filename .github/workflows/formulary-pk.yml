name: Formulary PK Engine

on:
  pull_request:
    paths:
      - "backend/app/formulary_pk.py"
      - "backend/tests/test_formulary_pk.py"
      - ".github/workflows/formulary-pk.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/formulary_pk.py"
      - "backend/tests/test_formulary_pk.py"

permissions:
  contents: read

jobs:
  pk-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PK engine unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p "test_formulary_pk.py" -v
